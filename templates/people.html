<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>住所録一覧</title>
</head>

<body>

    <h1>住所録一覧</h1>

<p>
    <a href="/add">新しい人を登録する</a>
</p>

{% for person in people %}

        <p>--------------------</p>

        <p>名前：{{ person["name"] }}</p>
        <p>年齢：{{ person["age"] }}</p>
        <p>趣味：{{ person["hobby"] }}</p>

    {% endfor %}

    <p>
        <a href="/">トップページへ戻る</a>
    </p>

</body>

</html>
