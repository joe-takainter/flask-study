{% extends "base.html" %}

{% block content %}

<h2>登録者詳細</h2>

<p>
    <strong>名前：</strong>
    {{ person["name"] }}
</p>

<p>
    <strong>年齢：</strong>
    {{ person["age"] }}歳
</p>

<p>
    <strong>趣味：</strong>
    {{ person["hobby"] }}
</p>


<p>
    <a href="{{ url_for('edit_person', person_id=person['id']) }}">
        編集する
    </a>

    |

    <a href="{{ url_for('delete_person', person_id=person['id']) }}">
        削除する
    </a>

    |

    <a href="{{ url_for('show_people') }}">
        一覧に戻る
    </a>
</p>

{% endblock %}
